$kind: http-request
url: https://postman-echo.com/status/200
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Check 1 — status is 200", function () { pm.expect(pm.response.code).to.equal(200); });
      pm.test("Check 2 — response time OK", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("Check 3 — has body", function () { pm.expect(pm.response.text()).to.not.be.empty; });
      pm.test("Check 4 — intentional fail", function () { pm.expect(false).to.be.true; });
      pm.test("Check 5 — intentional fail", function () { pm.expect(false).to.be.true; });
    language: text/javascript
settings: {}
order: 1000
